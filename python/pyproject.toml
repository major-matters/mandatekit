[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mandatekit"
version = "0.0.1"
description = "Sign and verify scope-bound mandates for AI agents. v0, tracks the AP2 Verifiable Intent draft."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Major Labs" }]
keywords = ["ai-agents", "ap2", "mandate", "verifiable-intent", "payments", "ed25519"]
# Vetted, constant-time Ed25519 (cryptography) and RFC 8785 canonicalization
# (rfc8785). Pure-Python fallbacks exist if these are absent (see signing.py /
# canonical.py), so the package still runs with zero deps for experimentation.
dependencies = [
  "cryptography>=42",
  "rfc8785>=0.1.2",
]

[project.optional-dependencies]
# Off-the-shelf LLM parsing / intent scoring. Not required for the core.
llm = ["anthropic>=0.40"]
# Property-based test suite.
test = ["hypothesis>=6", "bandit>=1.7"]

[project.urls]
Homepage = "https://majorlabs.co"

[project.scripts]
mandatekit = "mandatekit.cli:main"

[tool.setuptools]
packages = ["mandatekit"]

[tool.setuptools.package-data]
mandatekit = ["py.typed"]
