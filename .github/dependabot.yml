# Weekly dependency and action updates. Actions are pinned to commit SHAs in the
# workflows; Dependabot bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
