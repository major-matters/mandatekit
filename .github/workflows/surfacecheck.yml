name: MCP Surface Check
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: major-matters/mcp-surfacecheck@0ede68fd90961ab9321db693ed1cb89dc4de641f # v1.1.1
