name: MCP Surface Check
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: major-matters/mcp-surfacecheck@0ede68fd90961ab9321db693ed1cb89dc4de641f # v1.1.1
